<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Serials Downloader{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.4rem; } h2 { font-size: 1.1rem; margin-top: 2rem; }
    a { color: #0b5ed7; text-decoration: none; } a:hover { text-decoration: underline; }
    table { border-collapse: collapse; width: 100%; margin-top: .5rem; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #e3e3e3; }
    .badge { display: inline-block; padding: .1rem .5rem; border-radius: .6rem; font-size: .8rem; background: #eee; }
    .badge.active, .badge.downloaded { background: #d1e7dd; }
    .badge.paused, .badge.queued { background: #fff3cd; }
    .badge.error { background: #f8d7da; }
    .badge.completed { background: #e2e3e5; }
    form.inline { display: inline; }
    button { cursor: pointer; padding: .25rem .7rem; border: 1px solid #bbb; border-radius: .4rem; background: #f8f9fa; }
    button:hover { background: #eef0f2; }
    input, select { padding: .3rem .5rem; border: 1px solid #bbb; border-radius: .4rem; }
    .add-form { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .5rem; align-items: center; }
    .muted { color: #777; font-size: .85rem; }
    .alert { background: #f8d7da; border-radius: .4rem; padding: .5rem .8rem; margin: .8rem 0; }
    nav { margin-bottom: 1.5rem; display: flex; gap: 1rem; align-items: baseline; }
    nav .spacer { flex: 1; }
    progress { width: 100px; height: .7rem; }
  </style>
</head>
<body>
<nav>
  <strong><a href="/">Serials Downloader</a></strong>
  <span class="spacer"></span>
  <form class="inline" method="post" action="/check"><button>Проверить сейчас</button></form>
  <a href="/settings">Настройки</a>
  <span class="muted">v:{{ app_version }}</span>
</nav>
{% block content %}{% endblock %}
</body>
</html>
